<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #1a1a1a;
            color: white;
            padding: 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 { text-align: center; }

        #reader {
            width: 100%;
            border: 4px solid #3b82f6;
            border-radius: 12px;
            background: black;
        }

        .status {
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .idle { background: #3b82f6; }
        .success { background: #10b981; color: black; }
        .error { background: #ef4444; }
        .warning { background: #f59e0b; color: black; }
        .loading { background: #6366f1; }

        .qr-box {
            background: #2a2a2a;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 1rem;
            display: grid;
            gap: 0.5rem;
        }

        .qr-field {
            display: grid;
            gap: 0.25rem;
        }

        .qr-label {
            font-size: 0.85rem;
            color: #9ca3af;
            font-weight: 500;
        }

        .qr-value {
            font-size: 1.1rem;
            color: #3b82f6;
            font-weight: 600;
            word-break: break-all;
        }

        .hidden { display: none; }

        .info-text {
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>📱 GFG Founders Unplugged registration</h1>

    <div id="reader"></div>

    <div id="status" class="status idle">Ready to scan</div>

    <div id="qrBox" class="qr-box hidden">
        <div class="qr-field">
            <div class="qr-label">Registration Number:</div>
            <div id="qrReg" class="qr-value">-</div>
        </div>
        <div class="qr-field">
            <div class="qr-label">Name:</div>
            <div id="qrName" class="qr-value">-</div>
        </div>
    </div>

    <p class="info-text">Point camera at QR code</p>
</div>

<script>
let scanner;
let processing = false;

async function verifyRegistration(regNo) {
    try {
        // Send as FormData to match Django's request.POST.get()
        const response = await fetch("/api/scan/", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({
                registration_number: regNo
            })
        });

        return await response.json();
    } catch (error) {
        console.error("Fetch error:", error);
        return { status: "error", message: "Network error" };
    }
}

async function onScanSuccess(decodedText) {
    if (processing) return;
    processing = true;

    const regNo = decodedText.trim();
    document.getElementById("qrReg").innerText = regNo;
    document.getElementById("qrName").innerText = "Loading...";
    document.getElementById("qrBox").classList.remove("hidden");

    // Show loading state
    setStatus("⏳ Verifying...", "loading");

    try {
        const data = await verifyRegistration(regNo);
        console.log("Backend response:", data);

        // Display name and registration
        if (data.name) {
            document.getElementById("qrName").innerText = data.name;
        }

        if (data.status === "success") {
            setStatus(`✅ ${regNo} - ${data.name} - Marked!`, "success");
        }
        else if (data.status === "already_marked") {
            setStatus(`⚠️ ${regNo} - ${data.name} - Already marked!`, "warning");
        }
        else if (data.status === "not_registered") {
            setStatus("❌ Registration not found", "error");
        }
        else if (data.status === "invalid_qr") {
            setStatus("❌ Invalid QR code", "error");
        }
        else {
            setStatus("❌ Error: " + (data.message || "Unknown error"), "error");
        }

    } catch (error) {
        console.error("Error:", error);
        setStatus("❌ Server error", "error");
    }

    // Reset after 3 seconds
    setTimeout(() => {
        processing = false;
        setStatus("Ready to scan", "idle");
        document.getElementById("qrBox").classList.add("hidden");
        scanner.resume();
    }, 999);
}

function setStatus(text, type) {
    const statusEl = document.getElementById("status");
    statusEl.textContent = text;
    statusEl.className = `status ${type}`;
}

async function initScanner() {
    try {
        scanner = new Html5Qrcode("reader");
        await scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess,
            (error) => console.log("Scan error:", error)
        );
        setStatus("Ready to scan", "idle");
    } catch (error) {
        console.error("Scanner init error:", error);
        setStatus("❌ Camera not accessible", "error");
    }
}

window.onload = initScanner;
</script>

</body>
</html>
